<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Selección Campamento</title>

<style>
body { font-family: Arial; background:#f4f6f9; margin:20px; }
h2 { color:#0f4c81; }

select, button {
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  background:#0f4c81;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled {
  background:#999;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th {
  background:#0f4c81;
  color:white;
  padding:8px;
}

td {
  border:1px solid #ddd;
  padding:6px;
}

.info {
  margin-top:10px;
  font-weight:bold;
}

.error {
  color:red;
  margin-top:10px;
}
</style>

</head>

<body>

<header class="membrete">
  <div class="membrete-contenido">
    
    <div class="logo">
      <!-- Puedes sustituir por imagen oficial si quieres -->
      <div class="logo-box">MINERD</div>
    </div>

    <div class="texto">
      <div class="institucion">Ministerio de Educación</div>
      <div class="viceministerio">Viceministerio de Servicios Técnicos y Pedagógicos</div>
      <div class="direccion">Dirección de Educación Primaria</div>
      <div class="titulo">Selección de estudiantes para el campamento</div>
    </div>

  </div>
</header>
<label>Distrito:</label>
<select id="distrito" onchange="cargarListado()">
  <option value="">Cargando...</option>
</select>

<div class="info" id="info"></div>
<div class="error" id="error"></div>

<table id="tabla" style="display:none;">
<thead>
<tr>
<th>Sel</th>
<th>Centro</th>
<th>Grado</th>
<th>ID</th>
<th>Nombre</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button id="btnEnviar" onclick="enviar()" disabled>
Enviar selección
</button>

<script>

const URL = "https://script.google.com/macros/s/AKfycbyEbgTbCVudveQHDZpAPpPE4gnVsZB-hlWgvP6t5zCpuPDatg8stO5mZ7WG3o5LmlCZwA/exec";

let cuota = 0;
let distritoActual = "";

/* ================= JSONP ================= */
function jsonp(params, callback) {
  const cb = "cb_" + Date.now();

  const script = document.createElement("script");

  window[cb] = function(data) {
    delete window[cb];
    if (script.parentNode) script.parentNode.removeChild(script);
    callback(data);
  };

  script.onerror = function() {
    delete window[cb];
    if (script.parentNode) script.parentNode.removeChild(script);
    document.getElementById("error").textContent =
      "Error de conexión con el servidor.";
  };

  const query = new URLSearchParams({
    ...params,
    callback: cb,
    t: Date.now()
  });

  script.src = URL + "?" + query.toString();
  document.body.appendChild(script);
}

/* ================= CARGAR DISTRITOS ================= */
function cargarDistritos() {
  jsonp({ accion: "distritos" }, function(res) {

    const select = document.getElementById("distrito");
    select.innerHTML = '<option value="">Seleccione</option>';

    if (!res.ok) {
      document.getElementById("error").textContent = res.mensaje;
      return;
    }

    res.distritos.forEach(d => {
      const op = document.createElement("option");
      op.value = d.distrito;
      op.textContent = d.distrito + " (Cuota: " + d.cuota + ")";
      select.appendChild(op);
    });
  });
}

/* ================= CARGAR LISTADO ================= */
function cargarListado() {

  document.getElementById("error").textContent = "";
  const distrito = document.getElementById("distrito").value;

  if (!distrito) return;

  distritoActual = distrito;

  jsonp({ accion: "listado", distrito: distrito }, function(res) {

    if (!res.ok) {
      document.getElementById("error").textContent = res.mensaje;
      return;
    }

    cuota = res.cuota;

    const tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    res.estudiantes.forEach(est => {
      const fila = `
      <tr>
        <td><input type="checkbox" value="${est.IdEstudiante}" onchange="validar(this)"></td>
        <td>${est.Centro}</td>
        <td>${est.Grado}</td>
        <td>${est.IdEstudiante}</td>
        <td>${est["Nombre completo"]}</td>
      </tr>
      `;
      tbody.innerHTML += fila;
    });

    document.getElementById("tabla").style.display = "table";
    document.getElementById("btnEnviar").disabled = false;

    actualizarContador();
  });
}

/* ================= VALIDAR CUOTA ================= */
function validar(chk) {

  const seleccionados = document.querySelectorAll("input[type=checkbox]:checked").length;

  if (seleccionados > cuota) {
    chk.checked = false;
    document.getElementById("error").textContent =
      "No puede exceder la cuota (" + cuota + ")";
  } else {
    document.getElementById("error").textContent = "";
  }

  actualizarContador();
}

/* ================= CONTADOR ================= */
function actualizarContador() {
  const total = document.querySelectorAll("input[type=checkbox]:checked").length;

  document.getElementById("info").textContent =
    "Distrito: " + distritoActual +
    " | Cuota: " + cuota +
    " | Seleccionados: " + total;
}

/* ================= ENVIAR ================= */
function enviar() {

  const seleccionados = Array.from(
    document.querySelectorAll("input[type=checkbox]:checked")
  ).map(c => c.value);

  if (seleccionados.length === 0) {
    document.getElementById("error").textContent =
      "Debe seleccionar al menos un estudiante.";
    return;
  }

  const nombre = prompt("Nombre del responsable:");
  if (!nombre || nombre.trim() === "") return;

  const cedula = prompt("Cédula del responsable:");
  if (!cedula || cedula.trim() === "") return;

  jsonp({
    accion: "guardar",
    payload: JSON.stringify({
      distrito: distritoActual,
      nombreResponsable: nombre.trim(),
      cedulaResponsable: cedula.trim(),
      seleccionados: seleccionados
    })
  }, function(res) {

    if (!res.ok) {
      document.getElementById("error").textContent = res.mensaje;
      return;
    }

    alert("Envío realizado correctamente");
    location.reload();
  });
}

/* ================= INIT ================= */
cargarDistritos();

</script>

</body>
</html>
